name: Build LOOPS executables

on:
  workflow_dispatch:        # botão "Run workflow" na aba Actions
  push:
    tags: ["v*"]            # ao criar uma tag (ex.: v0.2), gera e publica um Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,    name: linux-x64 }     # 22.04 = compatível com Ubuntu 22.04+ (glibc mais antigo)
          - { os: ubuntu-22.04-arm, name: linux-arm64 }
          - { os: macos-15,        name: macos-arm64 }   # Macs Apple Silicon (M1/M2/M3...)
          - { os: macos-15-intel,  name: macos-x64 }     # Macs Intel
          - { os: windows-latest,  name: windows-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar PortAudio (só Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Instalar dependências
        run: python -m pip install --upgrade pip pyinstaller .

      - name: Gerar executável
        run: python packaging/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: loops-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
